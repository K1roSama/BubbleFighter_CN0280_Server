# BubbleFighter C++ 服务端生产配置模板。
# 上线前必须替换数据库主机、账户和密码注入方式，并按部署网络设置玩家可访问的 IPv4。
environment=production

network.bind_address=127.0.0.1
# NAT 部署：监听仍用本机内网 IP，单独设置玩家可达的公网地址；省略时沿用 bind_address。
# network.advertised_address=203.0.113.10
network.port=27100
network.clan_port=27101
network.equipment_relay_port=27104
network.io_threads=4
network.max_connections=1024
network.max_packet_bytes=1048585
network.max_send_queue_bytes=4194304

database.host=127.0.0.1
database.port=3306
database.name=bubble_fighter
database.user=bf_runtime
database.password_file=mysql.password
database.tls=required
database.pool_size=8
database.task_queue_capacity=2048
database.acquire_timeout_ms=1000
database.query_timeout_ms=3000
database.expected_schema_version=2

security.allow_offline_test_identity=false

# 未认证运维端点固定绑定回环地址，由本机代理或采集器访问。
operations.bind_address=127.0.0.1
operations.port=27102
operations.max_connections=32
operations.max_request_bytes=4096

# 跨机部署时这里必须填玩家能连到的地址，不能留 127.0.0.1。

match.loading_timeout_ms=90000
match.countdown_ms=4000
match.duration_ms=240000
match.use_room_duration=true
match.result_transition_ms=2000
match.result_duration_ms=20000

logging.path=logs/{date}.log
logging.level=info
logging.queue_capacity=16384
logging.rotate_bytes=104857600
logging.retained_files=14
logging.echo_console=true

shutdown.grace_timeout_ms=5000
life_attendance.journal_directory=../data/life-attendance

# Local WeaponMaster gameplay policy; the native client does not contain the original server XP table.
weapon_master.final_level=10
weapon_master.level_step=100
weapon_master.pang_experience=100
weapon_master.assist_experience=50
# Equal-weight primary pool verified against this client; keep at least two distinct templates.
weapon_master.primary_pool=2004,3103,4004

# Fishing inventory mappings: enable with a configured economy; zero keeps free practice asset-free.
# Supported enabled IDs: premium rod 190083, free pass 101606.
lobby_minigame.fishing_premium_rod_item=0
lobby_minigame.fishing_free_pass_item=0

