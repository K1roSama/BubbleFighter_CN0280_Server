# Append to an existing valid server configuration for local acceptance.
# Server-direct is still the room default. No unauthenticated TURN accounts.
ice.bind_address=127.0.0.1
ice.advertised_address=127.0.0.1
ice.port=3478
ice.relay_port_begin=49152
ice.relay_port_end=50175
ice.max_allocations=1024
ice.credential_lifetime_seconds=3600
ice.relay_only=false

# For a public deployment use the actual owned bind address above, and the
# externally reachable address here. Route UDP3478 and the relay range to it.
# Credentials are generated only for authenticated room members and expire.
