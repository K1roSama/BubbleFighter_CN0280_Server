# Append to an existing valid game-server configuration.
# Deploy coturn separately with use-auth-secret and the same private secret.
# Replace example.invalid with the actual reachable provider hostname.
ice.port=0
ice.stun_host=example.invalid
ice.stun_port=3478
ice.turn_host=example.invalid
ice.turn_port=3478
ice.turn_secret_env=BF_TURN_SHARED_SECRET
ice.credential_lifetime_seconds=3600
ice.relay_only=false

# BF_TURN_SHARED_SECRET is set only in the server process environment, never
# put into client packages or source control. Clients receive expiring leases.
